/*
 * Tinkers Construct
 * Master build file
 *
 * Authors: boni, Sunstrike, ProgWML6
 * Help from AbrarSyed
 */

plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'io.freefair.lombok' version '8.6'
}

repositories {
    mavenCentral()
    // Mantle 1.21 is built from source, see MIGRATION_1.21.md
    flatDir {
        dir project.mantle_libs
    }
    maven { // Mantle
        name = 'DVS1 Maven FS'
        url = 'https://dvs1.progwml6.com/files/maven'
    }
    maven { // CraftTweaker, Immersive Engineering, JEI
        name = 'BlameJared Maven'
        url = 'https://maven.blamejared.com'
    }
    maven { // JSON Things
        name = 'Dogforce Games'
        url = 'https://www.dogforce-games.com/maven/'
    }
    maven {
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

group = 'slimeknights.tconstruct'
base {
    archivesName = 'TinkersConstruct'
}
// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// sets version to the slimeKnights version format
task buildInfo {
    try {
        def cmd = "git rev-parse --short HEAD"
        def proc = cmd.execute()
        proc.waitFor()
        if (proc.exitValue() == 0) {
            ext.revision = proc.text.trim()
        } else {
            ext.revision = "GITBORK"
        }
    } catch (all) {
        ext.revision = "gitgud"
    }

    if (System.getenv().BUILD_NUMBER != null) {
        ext.buildNum = "${System.getenv().BUILD_NUMBER}"
    } else {
        ext.buildNum = "DEV.${project.buildInfo.revision}"
    }
}
ext.artifact_version = 'NFG'
if (System.getenv().ARTIFACT_VERSION == null) {
    artifact_version = "${mod_version}.${project.buildInfo.buildNum}"
}
if (System.getenv().ARTIFACT_VERSION != null) {
    artifact_version = "${System.getenv().ARTIFACT_VERSION}"
}

version = "${minecraft_version}-${artifact_version}"
println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}, Version: ${version}"

sourceSets {
    main {
        java {
            // Optional mod compat is not yet ported to 1.21.1 (MIGRATION_1.21.md, phase 7)
            exclude 'slimeknights/tconstruct/plugin/**'
        }
        resources {
            srcDirs "src/generated/resources"
            // But exclude the cache of the generated data from what gets built
            exclude '.cache'
            // exclude debug resources, they are for helping us make the mod, not for the actual mod
            exclude 'assets/tconstruct/debug'
        }
    }
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_version
        minecraftVersion = project.parchment_minecraft
    }

    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')
    // Validate AT files and raise errors when they have invalid targets
    validateAccessTransformers = true

    runs {
        client {
            client()
            // The below properties can be set in the gradle.properties file in your user home
            // (DO NOT add them directly to the gradle.properties file for this project)
            if (project.hasProperty('mc_uuid')) {
                programArguments.addAll '--uuid', project.getProperty('mc_uuid')
            }
            if (project.hasProperty('mc_username')) {
                programArguments.addAll '--username', project.getProperty('mc_username')
            }
            if (project.hasProperty('mc_accessToken')) {
                programArguments.addAll '--accessToken', project.getProperty('mc_accessToken')
            }
        }

        server {
            server()
            programArgument '--nogui'
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                '--output', file('src/generated/resources/').getAbsolutePath(),
                '--existing', file('src/main/resources/').getAbsolutePath(),
                '--existing-mod', 'mantle'
        }

        // applies to all the run configs above
        configureEach {
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP,CORE'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    api "slimeknights.mantle:Mantle:${minecraft_version}-${mantle_version}"

    // compile against the JEI API but do not include it at runtime
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    // at runtime, use the full JEI jar
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // TODO 1.21: restore optional compat once ported (MIGRATION_1.21.md, phase 7)
    // Immersive Engineering, MmmMmmMmmMmm, MoonlightLib, Diet, JSON Things, Balm, Crafting Tweaks

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.2'
    testImplementation 'org.mockito:mockito-inline:4.2.0'
    testImplementation 'org.assertj:assertj-core:3.21.0'
}

test {
    useJUnitPlatform()
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
        'version'          : artifact_version,
        'loader_range'     : loader_range,
        'minecraft_range'  : minecraft_range,
        'neo_range'        : neo_range,
        'mantle_range'     : mantle_range,
        'jei_range'        : jei_range,
        'json_things_range': json_things_range
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title"     : "Tinkers Construct",
                "Specification-Vendor"    : "Slime Knights",
                "Specification-Version"   : "1", // We are version 1 of ourselves
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : "${version}",
                "Implementation-Vendor"   : "Slime Knights",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

java {
    withSourcesJar()
}

sourcesJar {
    exclude 'assets/**'
    exclude 'data/**'
    exclude 'pack.png'
    exclude 'pack.mcmeta'
    exclude 'META-INF/neoforge.mods.toml'
}

artifacts {
    archives sourcesJar
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
            artifact sourcesJar
        }
    }

    repositories {
        if (project.hasProperty('DEPLOY_DIR')) {
            maven { url = DEPLOY_DIR }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    // TODO 1.21: remove both once the port compiles (MIGRATION_1.21.md)
    // show every error, the port will have many
    options.compilerArgs << '-Xmaxerrs' << '100000'
    // keep running annotation processors (Lombok) and later compile stages despite errors in earlier stages.
    // Without this, a single non-recoverable error hides every Lombok generated member and floods the log with false errors
    options.compilerArgs << '-XDshould-stop.ifError=FLOW'
}
